apiVersion: apps/v1
kind: Deployment
metadata:
  name: taskai-frontend
  namespace: taskai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: taskai-frontend
  template:
    metadata:
      labels:
        app: taskai-frontend
    spec:
      containers:
      - name: frontend
        image: ashishjha1421/taskai-frontend:latest
        ports:
        - containerPort: 3000
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "256Mi"
            cpu: "500m"
        readinessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 10
