apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: taskai
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Ashish-jha-85/taskai-infra
    targetRevision: HEAD
    path: kubernetes
  destination:
    server: https://kubernetes.default.svc
    namespace: taskai
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
